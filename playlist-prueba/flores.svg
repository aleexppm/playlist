<svg xmlns="http://www.w3.org/2000/svg" width="140" height="700" viewBox="0 0 140 700" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <g id="flor-rosa">
      <g fill="#f48fb1">
        <ellipse cx="0" cy="-13" rx="8" ry="13"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#ffd54f"/>
      <circle r="2.5" fill="#f9a825"/>
    </g>
    <g id="flor-clara">
      <g fill="#fff">
        <ellipse cx="0" cy="-13" rx="8" ry="13"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(288)"/>
      </g>
      <g fill="#f8bbd0" opacity=".55">
        <ellipse cx="0" cy="-10" rx="4" ry="8"/>
        <ellipse cx="0" cy="-10" rx="4" ry="8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-10" rx="4" ry="8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-10" rx="4" ry="8" transform="rotate(216)"/>
        <ellipse cx="0" cy="-10" rx="4" ry="8" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#ec407a"/>
    </g>
    <ellipse id="hoja" cx="0" cy="0" rx="14" ry="6" fill="#81c784"/>
  </defs>

  <!-- tallo ondulado: empieza y termina en x=70 para que el patrón no se corte -->
  <path d="M70,0 C110,44 110,131 70,175 C30,219 30,306 70,350
           C110,394 110,481 70,525 C30,569 30,656 70,700"
        fill="none" stroke="#66a36b" stroke-width="4" stroke-linecap="round"/>

  <!-- hojas -->
  <use href="#hoja" transform="translate(88,40) rotate(-35)"/>
  <use href="#hoja" transform="translate(46,140) rotate(30)"/>
  <use href="#hoja" transform="translate(40,230) rotate(-30)"/>
  <use href="#hoja" transform="translate(98,320) rotate(35)"/>
  <use href="#hoja" transform="translate(88,390) rotate(-35)"/>
  <use href="#hoja" transform="translate(46,490) rotate(30)"/>
  <use href="#hoja" transform="translate(40,580) rotate(-30)"/>
  <use href="#hoja" transform="translate(98,670) rotate(35)"/>

  <!-- flores grandes -->
  <use href="#flor-rosa"  transform="translate(98,87)  scale(1.25) rotate(10)"/>
  <use href="#flor-clara" transform="translate(42,262) scale(1.3)  rotate(25)"/>
  <use href="#flor-rosa"  transform="translate(98,437) scale(1.25) rotate(-15)"/>
  <use href="#flor-clara" transform="translate(42,612) scale(1.3)  rotate(5)"/>

  <!-- flores pequeñas y botones -->
  <use href="#flor-clara" transform="translate(112,180) scale(.6)"/>
  <use href="#flor-rosa"  transform="translate(22,350)  scale(.6)"/>
  <use href="#flor-clara" transform="translate(112,530) scale(.6)"/>
  <use href="#flor-rosa"  transform="translate(22,15)   scale(.55)"/>
  <circle cx="125" cy="310" r="4" fill="#f8bbd0"/>
  <circle cx="14"  cy="470" r="4" fill="#f8bbd0"/>
  <circle cx="126" cy="660" r="4" fill="#f8bbd0"/>
  <circle cx="16"  cy="130" r="3.5" fill="#fff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
